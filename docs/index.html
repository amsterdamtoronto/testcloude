<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kugoo × FastMotion — Brand Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f4f4f5;
    --surface-2: #ececef;
    --border: #e4e4e7;
    --text: #0a0a0a;
    --muted: #6b7280;
    --rank-bg: #18181b;
    --rank-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --surface: #161618;
      --surface-2: #1f1f23;
      --border: #2a2a2e;
      --text: #f4f4f5;
      --muted: #9ca3af;
      --rank-bg: #f4f4f5;
      --rank-fg: #0a0a0a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }
  header { margin-bottom: 32px; }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--muted); font-size: 14px; }
  section { margin-top: 32px; }
  h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .kpi-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .kpi-value {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .kpi-delta {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .kpi-delta-row { white-space: nowrap; }
  .kpi-delta b { color: var(--text); font-weight: 500; }
  .chart-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .chart-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .chart-head b {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart .grid line { stroke: var(--border); stroke-width: 1; }
  .chart .axis text { fill: var(--muted); font-size: 10px; font-family: inherit; }
  .chart .line { stroke: var(--text); stroke-width: 1.5; fill: none; }
  .chart .area { fill: var(--text); opacity: 0.06; }
  .chart .dot { fill: var(--text); }
  .chart .drop { fill: var(--muted); opacity: 0.5; }
  .chart .empty-msg { fill: var(--muted); font-size: 12px; font-family: inherit; }
  details.videos-all {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0;
  }
  details.videos-all > summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  details.videos-all > summary::-webkit-details-marker { display: none; }
  details.videos-all > summary::before {
    content: "▸";
    color: var(--muted);
    margin-right: 8px;
    font-size: 10px;
    transition: transform 0.15s ease;
    display: inline-block;
  }
  details.videos-all[open] > summary::before { transform: rotate(90deg); }
  details.videos-all > summary .count { color: var(--muted); font-weight: 400; }
  .videos-table {
    width: 100%;
    border-collapse: collapse;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .videos-table th,
  .videos-table td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .videos-table th {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: var(--surface-2);
  }
  .videos-table tr:last-child td { border-bottom: none; }
  .videos-table td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .videos-table td.idx { color: var(--muted); text-align: right; width: 32px; }
  .videos-table a.t-title {
    color: var(--text);
    text-decoration: none;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.3;
  }
  .videos-table a.t-title:hover { text-decoration: underline; }
  .videos-table .col-date { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .videos-table .col-dur { color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 720px) {
    .videos-table th.hide-sm, .videos-table td.hide-sm { display: none; }
    .videos-table th, .videos-table td { padding: 8px 8px; font-size: 12px; }
  }
  .top {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .top-row {
    display: grid;
    grid-template-columns: 28px 96px 1fr auto;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    text-decoration: none;
    color: inherit;
  }
  .top-row:hover { background: var(--surface-2); }
  .rank {
    width: 24px; height: 24px;
    border-radius: 999px;
    background: var(--rank-bg);
    color: var(--rank-fg);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .thumb {
    width: 96px; height: 54px;
    object-fit: cover;
    border-radius: 4px;
    background: var(--surface-2);
    display: block;
  }
  .meta { min-width: 0; }
  .title {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.3;
  }
  .meta-row {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .views {
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .views-sub {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }
  footer {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .empty {
    color: var(--muted);
    font-size: 14px;
    padding: 24px 0;
    text-align: center;
  }
  .quotes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 8px;
  }
  .quote {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .quote-text {
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .quote-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
    margin-top: auto;
  }
  .quote-author { font-weight: 500; color: var(--text); }
  .quote-likes { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .quote-video {
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .quote-video:hover { color: var(--text); }
  @media (max-width: 560px) {
    .wrap { padding: 24px 16px 48px; }
    .top-row { grid-template-columns: 24px 72px 1fr auto; gap: 10px; padding: 8px 10px; }
    .thumb { width: 72px; height: 40px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kugoo × FastMotion</h1>
    <div class="sub" id="sub">Дашборд коллабы — загрузка…</div>
  </header>

  <section>
    <h2>Сводка</h2>
    <div class="kpi-grid" id="kpis"></div>
  </section>

  <section>
    <h2>Динамика просмотров</h2>
    <div class="chart-wrap">
      <div class="chart-head">
        <span id="chart-range">за 30 дней</span>
        <b id="chart-current">—</b>
      </div>
      <div class="chart" id="chart"></div>
    </div>
  </section>

  <section>
    <h2>Топ-3 по просмотрам</h2>
    <div class="top" id="top"></div>
  </section>

  <section>
    <h2>Топ-3 по вовлечённости (ER)</h2>
    <div class="top" id="top-er"></div>
  </section>

  <section>
    <h2>Зрители говорят про Kugoo</h2>
    <div class="quotes" id="quotes-kugoo"></div>
  </section>

  <section>
    <h2>Зрители говорят про DNS</h2>
    <div class="quotes" id="quotes-dns"></div>
  </section>

  <section>
    <details class="videos-all" id="all-videos-block">
      <summary>
        <span>Все ролики коллабы <span class="count" id="all-videos-count"></span></span>
      </summary>
      <div id="all-videos"></div>
    </details>
  </section>

  <footer>
    <span id="updated">Последнее обновление: —</span>
    <span>Источник: YouTube Data API v3 · v0.09</span>
  </footer>
</div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function formatDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  function deltaText(d) {
    if (!d || d.signed == null) return "—";
    return d.signed;
  }

  function renderKpis(t, deltas) {
    const d24 = (deltas && deltas.h24) || {};
    const d7  = (deltas && deltas.d7)  || {};
    const hasDeltas = !!deltas;
    const items = [
      { label: "Роликов", value: t.videos ?? 0 },
      { label: "Просмотров", value: t.viewsCompact ?? "0",
        showDelta: hasDeltas, d24: deltaText(d24.views), d7: deltaText(d7.views) },
      { label: "Средние просмотры", value: t.avgViewsCompact ?? "0" },
      { label: "Engagement Rate", value: (t.engagementRate ?? 0).toFixed(2) + "%" },
      { label: "Лайков", value: t.likesCompact ?? "0",
        showDelta: hasDeltas, d24: deltaText(d24.likes), d7: deltaText(d7.likes) },
      { label: "Комментариев", value: t.commentsCompact ?? "0",
        showDelta: hasDeltas, d24: deltaText(d24.comments), d7: deltaText(d7.comments) },
    ];
    $("kpis").innerHTML = items.map((i) => {
      let delta = "";
      if (i.showDelta) {
        delta = `<div class="kpi-delta">
          <span class="kpi-delta-row"><b>${escapeHtml(i.d24)}</b> за 24ч</span>
          <span class="kpi-delta-row"><b>${escapeHtml(i.d7)}</b> за 7д</span>
        </div>`;
      }
      return `
        <div class="kpi">
          <div class="kpi-label">${escapeHtml(i.label)}</div>
          <div class="kpi-value">${escapeHtml(String(i.value))}</div>
          ${delta}
        </div>
      `;
    }).join("");
  }

  function renderChart(history, drops) {
    const el = $("chart");
    const points = (history && history.points) || [];
    const cur = $("chart-current");
    if (points.length >= 1) {
      cur.textContent = (points[points.length - 1].views || 0).toLocaleString("ru-RU") + " просмотров";
    }
    if (history && history.rangeDays) {
      $("chart-range").textContent = "за " + history.rangeDays + " дн.";
    }
    if (points.length < 2) {
      el.innerHTML = `<svg viewBox="0 0 800 220" preserveAspectRatio="none">
        <text class="empty-msg" x="400" y="115" text-anchor="middle">Накапливаем данные… (нужно минимум 2 снапшота)</text>
      </svg>`;
      return;
    }

    const W = 800, H = 220, ML = 56, MR = 16, MT = 12, MB = 28;
    const plotW = W - ML - MR;
    const plotH = H - MT - MB;

    const ts = points.map(p => new Date(p.ts).getTime());
    const vs = points.map(p => p.views || 0);
    const tMin = ts[0], tMax = ts[ts.length - 1];
    const vMin = Math.min(...vs), vMax = Math.max(...vs);
    const vRange = Math.max(1, vMax - vMin);
    const xs = (t) => ML + ((t - tMin) / Math.max(1, tMax - tMin)) * plotW;
    const ys = (v) => MT + (1 - (v - vMin) / vRange) * plotH;

    let path = "M " + xs(ts[0]) + " " + ys(vs[0]);
    for (let i = 1; i < points.length; i++) {
      path += " L " + xs(ts[i]) + " " + ys(vs[i]);
    }
    const area = path + ` L ${xs(tMax)} ${MT + plotH} L ${xs(tMin)} ${MT + plotH} Z`;

    // Y axis (3 ticks)
    const yTicks = [vMin, vMin + vRange / 2, vMax].map(v => ({
      v, y: ys(v),
      label: v >= 1e6 ? (v / 1e6).toFixed(2) + "M" :
             v >= 1e3 ? (v / 1e3).toFixed(0) + "K" : String(Math.round(v)),
    }));
    const grid = yTicks.map(t =>
      `<line x1="${ML}" x2="${ML + plotW}" y1="${t.y}" y2="${t.y}"/>`
    ).join("");
    const yLabels = yTicks.map(t =>
      `<text x="${ML - 8}" y="${t.y + 3}" text-anchor="end">${t.label}</text>`
    ).join("");

    // X axis (3 dates)
    const fmtDay = (ms) => {
      const d = new Date(ms);
      return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
    };
    const xTicks = [tMin, (tMin + tMax) / 2, tMax];
    const xLabels = xTicks.map(t =>
      `<text x="${xs(t)}" y="${H - 10}" text-anchor="middle">${fmtDay(t)}</text>`
    ).join("");

    // Video drop triangles (in plot range only)
    let dropsMarkup = "";
    if (Array.isArray(drops)) {
      for (const d of drops) {
        const t = new Date(d.ts).getTime();
        if (isNaN(t) || t < tMin || t > tMax) continue;
        const x = xs(t);
        const y = MT + plotH;
        dropsMarkup += `<polygon class="drop" points="${x - 3},${y + 4} ${x + 3},${y + 4} ${x},${y}"><title>${escapeHtml(d.title)}</title></polygon>`;
      }
    }

    const lastX = xs(ts[ts.length - 1]);
    const lastY = ys(vs[vs.length - 1]);

    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <g class="grid">${grid}</g>
      <path class="area" d="${area}"/>
      <path class="line" d="${path}"/>
      <circle class="dot" cx="${lastX}" cy="${lastY}" r="3"/>
      <g class="axis">${yLabels}${xLabels}</g>
      <g class="drops">${dropsMarkup}</g>
    </svg>`;
  }

  function renderQuotes(quotes, elId, emptyText) {
    const el = $(elId);
    if (!quotes || !quotes.length) {
      el.innerHTML = `<div class="empty">${escapeHtml(emptyText)}</div>`;
      return;
    }
    el.innerHTML = quotes.map((q) => `
      <div class="quote">
        <div class="quote-text">${escapeHtml(q.text)}</div>
        <div class="quote-meta">
          <span class="quote-author">${escapeHtml(q.author)}</span>
          <span class="quote-likes">${q.likeCount} ♥</span>
        </div>
        <a class="quote-video" href="${escapeHtml(q.url)}" target="_blank" rel="noopener" title="${escapeHtml(q.videoTitle)}">${escapeHtml(q.videoTitle)}</a>
      </div>
    `).join("");
  }

  function renderAllVideos(videos) {
    const el = $("all-videos");
    const cnt = $("all-videos-count");
    if (!videos || !videos.length) {
      cnt.textContent = "";
      el.innerHTML = '<div class="empty">Нет данных.</div>';
      return;
    }
    cnt.textContent = "(" + videos.length + ")";
    const rows = videos.map((v, i) => {
      const er = (v.engagementRate ?? ((v.viewCount > 0
        ? (v.likeCount + v.commentCount) / v.viewCount * 100 : 0))).toFixed(2);
      return `
        <tr>
          <td class="idx">${i + 1}</td>
          <td class="col-date">${escapeHtml(formatDate(v.publishedAt))}</td>
          <td>
            <a class="t-title" href="${escapeHtml(v.url)}" target="_blank" rel="noopener">${escapeHtml(v.title)}</a>
          </td>
          <td class="col-dur hide-sm">${escapeHtml(v.duration || "")}</td>
          <td class="num">${(v.viewCount || 0).toLocaleString("ru-RU")}</td>
          <td class="num hide-sm">${(v.likeCount || 0).toLocaleString("ru-RU")}</td>
          <td class="num hide-sm">${(v.commentCount || 0).toLocaleString("ru-RU")}</td>
          <td class="num">${er}%</td>
        </tr>
      `;
    }).join("");
    el.innerHTML = `
      <table class="videos-table">
        <thead>
          <tr>
            <th class="idx">#</th>
            <th>Дата</th>
            <th>Название</th>
            <th class="hide-sm">Длит.</th>
            <th class="num">Просмотры</th>
            <th class="num hide-sm">Лайки</th>
            <th class="num hide-sm">Комменты</th>
            <th class="num">ER</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function renderTop(top, elId, mode) {
    const el = $(elId);
    if (!top || !top.length) {
      el.innerHTML = '<div class="empty">Нет данных. Жду первого запуска backend.</div>';
      return;
    }
    el.innerHTML = top.map((v, idx) => {
      const er = (v.engagementRate ?? 0).toFixed(2);
      const views = escapeHtml(v.viewCountCompact ?? "0");
      const isEr = mode === "er";
      const rightMain = isEr ? `${er}%` : views;
      const rightSub  = isEr ? "ER" : "просмотров";
      const metaRight = isEr ? `${views} просмотров` : `ER ${er}%`;
      return `
        <a class="top-row" href="${escapeHtml(v.url)}" target="_blank" rel="noopener">
          <div class="rank">${idx + 1}</div>
          <img class="thumb" src="${escapeHtml(v.thumbnail)}" alt="" loading="lazy">
          <div class="meta">
            <div class="title">${escapeHtml(v.title)}</div>
            <div class="meta-row">
              <span>${escapeHtml(formatDate(v.publishedAt))}</span>
              <span>${escapeHtml(metaRight)}</span>
            </div>
          </div>
          <div>
            <div class="views">${rightMain}</div>
            <div class="views-sub">${rightSub}</div>
          </div>
        </a>
      `;
    }).join("");
  }

  try {
    const res = await fetch("./data.json?ts=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const t = data.totals || {};
    $("sub").textContent = `${data.channelHandle || ""} — ${t.videos || 0} роликов с меткой "${data.marker || "kugoo.ru"}"`;
    renderKpis(t, data.deltas);
    renderChart(data.history, data.videoDrops);
    renderTop(data.top || [], "top", "views");
    renderTop(data.topByEr || [], "top-er", "er");
    const q = data.quotes || {};
    const kugooQuotes = Array.isArray(q) ? q : (q.kugoo || []);
    const dnsQuotes = Array.isArray(q) ? [] : (q.dns || []);
    renderQuotes(kugooQuotes, "quotes-kugoo", "Положительных комментариев пока нет.");
    renderQuotes(dnsQuotes, "quotes-dns", "В комментариях к этим роликам пока нет положительных упоминаний DNS.");
    renderAllVideos(data.videos || []);
    $("updated").textContent = "Последнее обновление: " + (data.updatedAtMsk || "—");
  } catch (e) {
    $("sub").textContent = "Не удалось загрузить data.json";
    $("kpis").innerHTML = `<div class="empty">Ошибка: ${escapeHtml(e.message)}</div>`;
    renderTop([], "top", "views");
    renderTop([], "top-er", "er");
    renderChart({ points: [] }, []);
