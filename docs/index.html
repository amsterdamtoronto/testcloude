<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kugoo × FastMotion — Brand Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f4f4f5;
    --surface-2: #ececef;
    --border: #e4e4e7;
    --text: #0a0a0a;
    --muted: #6b7280;
    --rank-bg: #18181b;
    --rank-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --surface: #161618;
      --surface-2: #1f1f23;
      --border: #2a2a2e;
      --text: #f4f4f5;
      --muted: #9ca3af;
      --rank-bg: #f4f4f5;
      --rank-fg: #0a0a0a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }
  header { margin-bottom: 32px; }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--muted); font-size: 14px; }
  section { margin-top: 32px; }
  h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .kpi-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .kpi-value {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .top {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .top-row {
    display: grid;
    grid-template-columns: 28px 96px 1fr auto;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    text-decoration: none;
    color: inherit;
  }
  .top-row:hover { background: var(--surface-2); }
  .rank {
    width: 24px; height: 24px;
    border-radius: 999px;
    background: var(--rank-bg);
    color: var(--rank-fg);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .thumb {
    width: 96px; height: 54px;
    object-fit: cover;
    border-radius: 4px;
    background: var(--surface-2);
    display: block;
  }
  .meta { min-width: 0; }
  .title {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.3;
  }
  .meta-row {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .views {
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .views-sub {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }
  footer {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .empty {
    color: var(--muted);
    font-size: 14px;
    padding: 24px 0;
    text-align: center;
  }
  .quotes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 8px;
  }
  .quote {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .quote-text {
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .quote-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
    margin-top: auto;
  }
  .quote-author { font-weight: 500; color: var(--text); }
  .quote-likes { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .quote-video {
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .quote-video:hover { color: var(--text); }
  @media (max-width: 560px) {
    .wrap { padding: 24px 16px 48px; }
    .top-row { grid-template-columns: 24px 72px 1fr auto; gap: 10px; padding: 8px 10px; }
    .thumb { width: 72px; height: 40px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kugoo × FastMotion</h1>
    <div class="sub" id="sub">Дашборд коллабы — загрузка…</div>
  </header>

  <section>
    <h2>Сводка</h2>
    <div class="kpi-grid" id="kpis"></div>
  </section>

  <section>
    <h2>Топ-3 по просмотрам</h2>
    <div class="top" id="top"></div>
  </section>

  <section>
    <h2>Зрители говорят про Kugoo</h2>
    <div class="quotes" id="quotes-kugoo"></div>
  </section>

  <section>
    <h2>Зрители говорят про DNS</h2>
    <div class="quotes" id="quotes-dns"></div>
  </section>

  <footer>
    <span id="updated">Последнее обновление: —</span>
    <span>Источник: YouTube Data API v3 · v0.06</span>
  </footer>
</div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function formatDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  function renderKpis(t) {
    const items = [
      { label: "Роликов", value: t.videos ?? 0 },
      { label: "Просмотров", value: t.viewsCompact ?? "0" },
      { label: "Средние просмотры", value: t.avgViewsCompact ?? "0" },
      { label: "Engagement Rate", value: (t.engagementRate ?? 0).toFixed(2) + "%" },
      { label: "Лайков", value: t.likesCompact ?? "0" },
      { label: "Комментариев", value: t.commentsCompact ?? "0" },
    ];
    $("kpis").innerHTML = items.map((i) => `
      <div class="kpi">
        <div class="kpi-label">${escapeHtml(i.label)}</div>
        <div class="kpi-value">${escapeHtml(String(i.value))}</div>
      </div>
    `).join("");
  }

  function renderQuotes(quotes, elId, emptyText) {
    const el = $(elId);
    if (!quotes || !quotes.length) {
      el.innerHTML = `<div class="empty">${escapeHtml(emptyText)}</div>`;
      return;
    }
    el.innerHTML = quotes.map((q) => `
      <div class="quote">
        <div class="quote-text">${escapeHtml(q.text)}</div>
        <div class="quote-meta">
          <span class="quote-author">${escapeHtml(q.author)}</span>
          <span class="quote-likes">${q.likeCount} ♥</span>
        </div>
        <a class="quote-video" href="${escapeHtml(q.url)}" target="_blank" rel="noopener" title="${escapeHtml(q.videoTitle)}">${escapeHtml(q.videoTitle)}</a>
      </div>
    `).join("");
  }

  function renderTop(top) {
    const el = $("top");
    if (!top || !top.length) {
      el.innerHTML = '<div class="empty">Нет данных. Жду первого запуска backend.</div>';
      return;
    }
    el.innerHTML = top.map((v, idx) => `
      <a class="top-row" href="${escapeHtml(v.url)}" target="_blank" rel="noopener">
        <div class="rank">${idx + 1}</div>
        <img class="thumb" src="${escapeHtml(v.thumbnail)}" alt="" loading="lazy">
        <div class="meta">
          <div class="title">${escapeHtml(v.title)}</div>
          <div class="meta-row">
            <span>${escapeHtml(formatDate(v.publishedAt))}</span>
            <span>ER ${(v.engagementRate ?? 0).toFixed(2)}%</span>
          </div>
        </div>
        <div>
          <div class="views">${escapeHtml(v.viewCountCompact ?? "0")}</div>
          <div class="views-sub">просмотров</div>
        </div>
      </a>
    `).join("");
  }

  try {
    const res = await fetch("./data.json?ts=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const t = data.totals || {};
    $("sub").textContent = `${data.channelHandle || ""} — ${t.videos || 0} роликов с меткой "${data.marker || "kugoo.ru"}"`;
    renderKpis(t);
    renderTop(data.top || []);
    const q = data.quotes || {};
    const kugooQuotes = Array.isArray(q) ? q : (q.kugoo || []);
    const dnsQuotes = Array.isArray(q) ? [] : (q.dns || []);
    renderQuotes(kugooQuotes, "quotes-kugoo", "Положительных комментариев пока нет.");
    renderQuotes(dnsQuotes, "quotes-dns", "В комментариях к этим роликам пока нет положительных упоминаний DNS.");
    $("updated").textContent = "Последнее обновление: " + (data.updatedAtMsk || "—");
  } catch (e) {
    $("sub").textContent = "Не удалось загрузить data.json";
    $("kpis").innerHTML = `<div class="empty">Ошибка: ${escapeHtml(e.message)}</div>`;
    renderTop([]);
    renderQuotes([], "quotes-kugoo", "Ошибка загрузки.");
    renderQuotes([], "quotes-dns", "Ошибка загрузки.");
  }
})();
</script>
</body>
</html>
